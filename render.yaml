services:
  - type: web
    name: bizflow-360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: bizflow-360-postgres
          property: connectionString
      - key: Cors__AllowedOrigins__0
        value: https://bizflow-360-3t42cfwym-bwiseverse.vercel.app

databases:
  - name: bizflow-360-postgres
    databaseName: bizflow
    user: bizflow
