services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizflow
      POSTGRES_USER: bizflow
      POSTGRES_PASSWORD: bizflow_dev
    ports:
      - "5432:5432"
    volumes:
      - bizflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow -d bizflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=bizflow;Username=bizflow;Password=bizflow_dev
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bizflow_postgres:
